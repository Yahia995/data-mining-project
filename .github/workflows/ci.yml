name: Continuous Integration

on:
  push:
    branches: [ main, master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Build, Run Pipeline & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test Data Ingestion
        run: |
          python -m src.ingestion.download
          ls -la data/raw/dz_emotion_raw.csv

      - name: Run Data Validation Checks
        run: |
          python -m src.validation.validate --csv-path data/raw/dz_emotion_raw.csv

      - name: Run End-to-End Data Pipeline
        run: |
          python run_pipeline.py
          ls -la data/processed/

      - name: Verify Split Files Exist
        run: |
          test -f data/processed/train.csv
          test -f data/processed/val.csv
          test -f data/processed/test.csv
          test -f data/processed/dz_emotion_processed.csv

      - name: Run Test Suite
        run: |
          pytest tests/ -v
